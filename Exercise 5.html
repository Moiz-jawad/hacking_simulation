<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hackerman Demo — Cursor + Progress</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="Exercise 5.css" />
  </head>
  <body>
    <div class="wrap">
      <pre
        id="console"
      ><span id="output"></span><span id="cursor" class="cursor"></span></pre>

      <div class="progress-wrap">
        <div class="progress-track" aria-hidden="false">
          <div id="fill" class="progress-fill"></div>
        </div>
        <div class="progress-meta">
          <div>Hack Simulation</div>
          <div id="percent">0%</div>
        </div>
      </div>

      <div class="center" id="status">Starting shortly...</div>
    </div>
    <script src="Exercise 5.js"></script>
  </body>
</html>
